name: Build AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.jks" -storetype JKS \
            -alias uncivai -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass uncivai123 -keypass uncivai123 \
            -dname "CN=Unciv AI, OU=Dev, O=UncivAI, L=CN, ST=CN, C=CN"
          echo "CI_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "CI_KEYSTORE_PASSWORD=uncivai123" >> "$GITHUB_ENV"
          echo "CI_KEY_ALIAS=uncivai" >> "$GITHUB_ENV"
          echo "CI_KEY_PASSWORD=uncivai123" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew :android:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: unciv-ai-release
          path: android/build/outputs/apk/release/*.apk
          retention-days: 30
